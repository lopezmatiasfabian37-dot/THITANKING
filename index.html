    .glow { display:none;
      
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .22;
      pointer-events: none;
      z-index: 0;
    }

    .glow.one { background: var(--purple); top: -90px; left: -90px; }
    .glow.two { background: var(--yellow); bottom: -120px; right: -90px; }

    .card {
      position: relative;
      z-index: 1;
      width: min(460px, 100%);
      padding: 42px 28px 30px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: rgba(8, 8, 18, .55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0,0,0,.5);
      animation: enter .7s ease both;
    }

    .logo {
      width: 108px;
      height: 108px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--yellow));
      color: #17121f;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
      box-shadow: 0 0 45px rgba(155,92,255,.4);
    }

    .badge {
      display: inline-block;
      margin-bottom: 15px;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #ddd;
      background: rgba(255,255,255,.05);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 9vw, 42px);
      letter-spacing: 2px;
      line-height: 1.05;
    }

    .headline {
      margin: 14px auto 10px;
      max-width: 360px;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.35;
    }

    .description {
      margin: 0 auto 28px;
      max-width: 370px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 16px 20px;
      border-radius: 16px;
      color: #061109;
      background: var(--whatsapp);
      text-decoration: none;
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(37,211,102,.22);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(37,211,102,.32);
    }

    .btn:active { transform: translateY(0); }
    .whatsapp-alt {
      margin-top: 10px;
      background: rgba(37,211,102,.88);
    }


    .share-btn {
      width: 100%;
      min-height: 52px;
      margin-top: 12px;
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 15px;
      color: #fff;
      background: rgba(255,255,255,.06);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .share-btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.11);
    }

    .message {
      min-height: 18px;
      margin-top: 10px;
      color: #bfeecf;
      font-size: 12px;
    }

    .info {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      color: #a9a9b6;
      font-size: 12px;
    }

    .dot {
      width: 7px;
